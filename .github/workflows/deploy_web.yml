name: Web'e yayınla (ücretsiz test)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Web platformu eksikse oluştur
        run: |
          if [ ! -d "web" ]; then
            flutter create --platforms=web --org com.minikkasif --project-name minik_kasif /tmp/scaffold_web
            cp -r /tmp/scaffold_web/web .
          fi

      - name: Bağımlılıkları kur
        run: flutter pub get

      - name: Web derle
        run: flutter build web --release --base-href /minik-kasif/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
